# Enforces the definition of ready and keeps the `ready-for-dev` /
# `needs-refinement` labels in sync with the RPDR-Fantasy-League project board.
# Rules: docs/workflow.md. Checks: .github/scripts/workflow-checks.cjs.
#
#   ready-for-dev added    -> check the definition of ready. If it fails, swap back to
#                             needs-refinement and comment with what's missing.
#                             If it passes: remove needs-refinement; add to board if missing;
#                             move Backlog/no-status -> Ready (never moves In progress/review/Done)
#   needs-refinement added -> remove ready-for-dev; add to board if missing;
#                             move Ready/no-status -> Backlog
#
# Requires a repo secret PROJECT_TOKEN: a classic personal access token with the
# `project` scope (GITHUB_TOKEN cannot access user-owned Projects). Without it,
# the label checks still run and the board step is skipped with a warning.
name: Sync readiness labels with project board

on:
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write

jobs:
  sync:
    if: github.event.label.name == 'ready-for-dev' || github.event.label.name == 'needs-refinement'
    # Job-level (not workflow-level) so runs for unrelated labels skip without
    # cancelling a pending readiness run when several labels are added at once.
    concurrency:
      group: readiness-${{ github.event.issue.number }}
    runs-on: ubuntu-latest
    env:
      GH_REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_NODE_ID: ${{ github.event.issue.node_id }}
      PROJECT_ID: PVT_kwHOBG1Fas4BKPqB
      STATUS_FIELD_ID: PVTSSF_lAHOBG1Fas4BKPqBzg6K1Mc
      STATUS_BACKLOG: f75ad846
      STATUS_READY: 61e4505c
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - name: Check definition of ready
        id: gate
        uses: actions/github-script@v7
        with:
          script: |
            const label = context.payload.label.name;
            if (label !== 'ready-for-dev') { core.setOutput('label', label); return; }
            const { checkReady } = require('./.github/scripts/workflow-checks.cjs');
            const { data: issue } = await github.rest.issues.get({ ...context.repo, issue_number: context.issue.number });
            const problems = checkReady(issue);
            if (problems.length === 0) { core.setOutput('label', 'ready-for-dev'); return; }
            await github.rest.issues.addLabels({ ...context.repo, issue_number: context.issue.number, labels: ['needs-refinement'] });
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: [
                "This issue isn't ready for development yet, so `ready-for-dev` was swapped back to `needs-refinement`.",
                '',
                ...problems.map((p) => `- ${p}`),
                '',
                'Fix these and add `ready-for-dev` again. See `docs/workflow.md` for the definition of ready.',
              ].join('\n'),
            });
            core.notice(`#${context.issue.number} failed the definition of ready: ${problems.join(' ')}`);
            core.setOutput('label', 'needs-refinement');

      - name: Keep readiness labels mutually exclusive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LABEL: ${{ steps.gate.outputs.label }}
        run: |
          if [ "$LABEL" = "ready-for-dev" ]; then other="needs-refinement"; else other="ready-for-dev"; fi
          if gh issue view "$ISSUE_NUMBER" --json labels -q '.labels[].name' | grep -qx "$other"; then
            gh issue edit "$ISSUE_NUMBER" --remove-label "$other"
            echo "Removed '$other' from #$ISSUE_NUMBER"
          fi

      - name: Update project board status
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          LABEL: ${{ steps.gate.outputs.label }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::PROJECT_TOKEN secret is not set; skipping project board sync."
            exit 0
          fi

          data=$(gh api graphql -f id="$ISSUE_NODE_ID" -f query='
            query($id: ID!) {
              node(id: $id) {
                ... on Issue {
                  projectItems(first: 20) {
                    nodes {
                      id
                      project { id }
                      fieldValueByName(name: "Status") {
                        ... on ProjectV2ItemFieldSingleSelectValue { name }
                      }
                    }
                  }
                }
              }
            }')
          item=$(jq -r --arg p "$PROJECT_ID" '[.data.node.projectItems.nodes[] | select(.project.id == $p)][0].id // ""' <<< "$data")
          status=$(jq -r --arg p "$PROJECT_ID" '[.data.node.projectItems.nodes[] | select(.project.id == $p)][0].fieldValueByName.name // ""' <<< "$data")

          if [ -z "$item" ]; then
            item=$(gh api graphql -f p="$PROJECT_ID" -f c="$ISSUE_NODE_ID" \
              -q '.data.addProjectV2ItemById.item.id' -f query='
              mutation($p: ID!, $c: ID!) {
                addProjectV2ItemById(input: { projectId: $p, contentId: $c }) { item { id } }
              }')
            echo "Added #$ISSUE_NUMBER to the project board"
          fi

          if [ "$LABEL" = "ready-for-dev" ]; then
            case "$status" in ""|"Backlog") target="$STATUS_READY"; name="Ready" ;; *) target="" ;; esac
          else
            case "$status" in ""|"Ready") target="$STATUS_BACKLOG"; name="Backlog" ;; *) target="" ;; esac
          fi

          if [ -z "$target" ]; then
            echo "Status is '$status'; leaving it unchanged."
            exit 0
          fi

          gh api graphql -f p="$PROJECT_ID" -f i="$item" -f f="$STATUS_FIELD_ID" -f o="$target" --silent -f query='
            mutation($p: ID!, $i: ID!, $f: ID!, $o: String!) {
              updateProjectV2ItemFieldValue(input: {
                projectId: $p, itemId: $i, fieldId: $f, value: { singleSelectOptionId: $o }
              }) { projectV2Item { id } }
            }'
          echo "Moved #$ISSUE_NUMBER from '${status:-no status}' to '$name'"
